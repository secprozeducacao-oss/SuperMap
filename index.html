<section class="view on" id="home" aria-label="Início">

    <button class="btn" data-f="a" aria-pressed="false">🛍️ Variedade</button>

  <div class="cidade"><svg id="cidade" viewBox="0 0 360 400" preserveAspectRatio="xMidYMid slice" role="group" aria-label="Mapa com os mercados próximos"></svg><div id="tip"></div></div>
  <div class="cards" id="cards"></div>
</section>

<section class="view" id="attr" aria-label="Detalhes do mercado">
  <div class="hero" id="hero"><button class="btn" data-go="home">Voltar</button><div class="hero-overlay"></div></div>
  <div class="det">
    <h2 id="aNome"></h2><div class="end" id="aEnd"></div>
    <div class="nota"><span>🛍️ Variedade</span><span id="sA"></span></div>
    <div class="nota"><span>💰 Preços</span><span id="sP"></span></div>
    <div class="nota"><span>⚡ Velocidade</span><span id="sV"></span></div>
    <div class="acoes">
      <a class="btn" id="aRota" target="_blank" rel="noopener">🗺️ Rota externa</a>
      <button class="btn p" data-go="mapa">🛒 Mapa interno</button>
    </div>
  </div>
</section>

<section class="view" id="mapa" aria-label="Mapa interno">
  <div class="cab"><button class="btn" data-go="attr" aria-label="Voltar para o mercado">⭠</button><div><h3 id="mNome"></h3><small id="mInfo" aria-live="polite"></small></div></div>
  <div class="plan"><svg id="planta" viewBox="0 0 360 520" role="img" aria-label="Planta do mercado com a rota até o próximo produto"></svg></div>
</section>

<section class="view" id="pesq" aria-label="Pesquisa">
  <div class="pg"><h2>🔎 Pesquisar</h2>
    <label for="q" style="font-size:.9rem">Produto ou categoria</label>
    <input type="text" id="q" autocomplete="off" placeholder="Ex.: alho, leite, arroz..." style="width:100%">
    <ul id="res"></ul>
    <div class="cats" id="cats"></div>
  </div>
</section>

<section class="view" id="conf" aria-label="Ajustes">
  <div class="pg"><button class="btn" id="voltaConf">🏠 Voltar</button>
    <h2 style="margin-top:1rem">♿ Acessibilidade</h2>
    <div id="tamLabel">Tamanho do texto</div>
    <div class="tam" role="group" aria-labelledby="tamLabel">
      <button class="btn" data-esc="1" aria-pressed="true">A</button>
      <button class="btn" data-esc="1.25" aria-pressed="false" style="font-size:1.15em">A+</button>
      <button class="btn" data-esc="1.5" aria-pressed="false" style="font-size:1.3em">A++</button>
    </div>
    <label class="sw">Alto contraste <input type="checkbox" id="alto"></label>
    <label class="sw">Reduzir animações <input type="checkbox" id="mov"></label>
    <h2 style="margin-top:1.2rem">🔔 Notificações</h2>
    <label class="sw">Avisos de promoções <input type="checkbox" checked></label>
    <label class="sw">Avisar quando a fila estiver curta <input type="checkbox"></label>
  </div>
</section>

<section class="view" id="ia" aria-label="Assistente">
  <div class="pg" style="padding-bottom:.2rem"><h2>🤖 Assistente de receitas</h2></div>
  <div id="chat" role="log" aria-live="polite"></div>
  <div class="sug" id="sugIA"><button class="btn">Quero fazer um vinagrete</button><button class="btn">Lasanha</button><button class="btn">Panqueca</button><button class="btn">Feijoada</button></div>
  <form class="lin" id="chatForm" style="padding:.4rem 1rem .8rem" autocomplete="off">
    <label for="msgIn" style="position:absolute;left:-999px">Mensagem</label>
    <input type="text" id="msgIn" placeholder="Digite sua mensagem...">
    <button class="btn p" type="submit">Enviar</button>
  </form>
</section>

<div id="lista" role="dialog" aria-label="Lista de compras">
  <div class="lh"><h3>📝 Lista</h3><button class="btn" id="fechaLista">❌</button></div>
  <div class="prog"><i id="prog"></i></div>
  <div class="lh">
      <small id="cont" style="color:var(--mut)"></small>
      <button class="btn" id="limpaLista" style="min-height: 2rem; padding: 0.2rem 0.5rem; font-size: 0.8rem">🗑️ Limpar</button>
  </div>

  <div class="lin"><input type="text" id="novo" aria-label="Adicionar produto" placeholder="Adicionar produto"><button class="btn p" id="addBtn" aria-label="Adicionar">+</button></div>

<script>
function simulaDevSplash() {
  const containerLogs = document.getElementById("devLogs");
  const splash = document.getElementById("devSplash");

  const listaMensagens = [
    "> Carregando base de supermercados (pandas)...",
    "> Gerando grafos de rotas internas...",
    "> Modelo IA (NLP) pronto!",
    "<span class='ok'>> Status: OK! Abrindo App...</span>"
  ];

  let index = 0;
  const interval = setInterval(function() {
    if (index < listaMensagens.length) {
      const novalinha = document.createElement("span");
      novalinha.innerHTML = listaMensagens[index];
      containerLogs.appendChild(novalinha);
      index++;
    } else {
      clearInterval(interval);
      setTimeout(function() {
        splash.classList.add("esconder");
      }, 700);
    }
  }, 500);
}

simulaDevSplash();

function $(seletor) {
  return document.querySelector(seletor);
}

function $$(seletor) {
  return Array.from(document.querySelectorAll(seletor));
}

function normalizarTexto(texto) {
  return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

function capitalizar(texto) {
  return texto.charAt(0).toUpperCase() + texto.slice(1);
}

function escaparHTML(str) {
  return str.replace(/[&<>]/g, function(c) {
    if (c === "&") return "&amp;";
    if (c === "<") return "&lt;";
    if (c === ">") return "&gt;";
  });
}

function gerarEstrelas(nota) {
  let estrelasValidas = "★".repeat(nota);
  let estrelasVazias = "☆".repeat(5 - nota);
  return `<span class="st" role="img" aria-label="${nota} de 5 estrelas">${estrelasValidas}${estrelasVazias}</span>`;
}

let telaAtual = "home";
let telaAnterior = "home";

function navegarPara(idTela) {
  if (idTela === "conf" && telaAtual !== "conf") {
    telaAnterior = telaAtual;
  }
  telaAtual = idTela;

  let todasViews = $$(".view");
  for (let i = 0; i < todasViews.length; i++) {
    let v = todasViews[i];
    if (v.id === idTela) {
      v.classList.add("on");
    } else {
      v.classList.remove("on");
    }
  }

  let abas = $("#tabs");
  if (["mapa", "pesq", "ia"].includes(idTela)) {
    abas.classList.add("on");
  } else {
    abas.classList.remove("on");
  }

  let botoesAba = $$("#tabs [data-go]");
  for (let i = 0; i < botoesAba.length; i++) {
    let b = botoesAba[i];
    if (b.dataset.go === idTela) {
      b.classList.add("on");
    } else {
      b.classList.remove("on");
    }
  }

  $("#lista").classList.remove("on");

  if (idTela === "mapa") desenharMapaInterno();
  if (idTela === "pesq") realizarBusca();

  $("#app").scrollTop = 0;
}

document.addEventListener("click", function(e) {
  let btn = e.target.closest("[data-go]");
  if (btn) {
    navegarPara(btn.dataset.go);
  }
});

$("#voltaConf").onclick = function() {
  navegarPara(telaAnterior);
};

$("[data-t=lista]").onclick = function() {
  navegarPara("mapa");
  $("#lista").classList.add("on");
  renderizarListaCompras();
};

let configuracoes = {
  esc: 1,
  alto: false,
  mov: false
};

try {
  let salvo = localStorage.getItem("supermap_config");
  if (salvo) {
    configuracoes = Object.assign(configuracoes, JSON.parse(salvo));
  }
} catch (err) {}

function aplicarConfiguracoes() {
  let root = document.documentElement;
  root.style.setProperty("--esc", configuracoes.esc);
  root.dataset.alto = configuracoes.alto ? "1" : "0";
  root.dataset.mov = configuracoes.mov ? "1" : "0";

  let botoesEscala = $$("[data-esc]");
  for (let i = 0; i < botoesEscala.length; i++) {
    let b = botoesEscala[i];
    b.setAttribute("aria-pressed", Number(b.dataset.esc) === Number(configuracoes.esc));
  }

  $("#alto").checked = configuracoes.alto;
  $("#mov").checked = configuracoes.mov;

  try {
    localStorage.setItem("supermap_config", JSON.stringify(configuracoes));
  } catch (e) {}
}

let botoesEscala = $$("[data-esc]");
for (let i = 0; i < botoesEscala.length; i++) {
  botoesEscala[i].onclick = function() {
    configuracoes.esc = Number(this.dataset.esc);
    aplicarConfiguracoes();
  };
}

$("#alto").onchange = function(e) {
  configuracoes.alto = e.target.checked;
  aplicarConfiguracoes();
};

$("#mov").onchange = function(e) {
  configuracoes.mov = e.target.checked;
  aplicarConfiguracoes();
};

let mercadoSelecionado = listaMercados[0];
let filtrosAtivos = new Set();

function passaFiltros(mercado) {
  let passou = true;
  filtrosAtivos.forEach(function(f) {
    if (mercado[f] < 4) {
      passou = false;
    }
  });
  return passou;
}

const tooltip = $("#tip");

function mostrarTooltip(elemento, mercado) {
  let rectElem = elemento.getBoundingClientRect();
  let rectCidade = $(".cidade").getBoundingClientRect();

  tooltip.innerHTML = `<b>${mercado.n}</b><br>${mercado.d} de você<br>Variedade ${gerarEstrelas(mercado.a)}<br>Preços ${gerarEstrelas(mercado.p)}<br>Velocidade ${gerarEstrelas(mercado.v)}`;
  tooltip.style.display = "block";

  let posX = rectElem.left + (rectElem.width / 2) - rectCidade.left - 84;
  let posXAjustada = Math.min(Math.max(posX, 4), rectCidade.width - tooltip.offsetWidth - 4);

  let posY = rectElem.top - rectCidade.top - tooltip.offsetHeight - 8;
  let posYAjustada = Math.max(posY, 4);

  tooltip.style.left = posXAjustada + "px";
  tooltip.style.top = posYAjustada + "px";
}

function renderizarHome() {
  let defsSVG = `<defs>`;
  for (let i = 0; i < listaMercados.length; i++) {
    defsSVG += `<pattern id="imgMercado${i}" x="0" y="0" height="1" width="1" patternContentUnits="objectBoundingBox">
      <image x="0" y="0" width="1" height="1" preserveAspectRatio="xMidYMid slice" href="${listaMercados[i].img}"/>
    </pattern>`;
  }
  defsSVG += `</defs>`;

  let htmlMapa = defsSVG + `
    <rect width="360" height="400" fill="#e7ecd9"/>
    <path d="M0 335 Q120 280 200 345 T360 305 V400 H0Z" fill="#b9d6e3"/>
    <rect x="190" y="60" width="90" height="60" rx="14" fill="#cddfb5"/>
    <rect x="10" y="230" width="70" height="50" rx="14" fill="#cddfb5"/>
    <g stroke="#fff" stroke-width="9" fill="none" stroke-linecap="round">
      <path d="M0 200H360"/>
      <path d="M180 0V340"/>
      <path d="M0 120L200 60L360 110"/>
      <path d="M60 0L110 300"/>
      <path d="M300 0V300"/>
    </g>
    <circle cx="180" cy="255" r="7" fill="#2f5f9e" stroke="#fff" stroke-width="3"/>
    <text x="180" y="278" font-size="11" text-anchor="middle" fill="#333" font-weight="700">você</text>
  `;

  for (let i = 0; i < listaMercados.length; i++) {
    let m = listaMercados[i];
    let ativo = passaFiltros(m);
    let classeOff = ativo ? "" : "off";

    htmlMapa += `
      <g class="pin ${classeOff}" data-i="${i}" role="button" tabindex="0" aria-label="${m.n}, a ${m.d}">
        <circle class="c" cx="${m.x}" cy="${m.y}" r="${m.r}" fill="url(#imgMercado${i})" stroke="${m.c}" stroke-width="3"/>
      </g>
    `;
  }

  $("#cidade").innerHTML = htmlMapa;    let pins = $$(".pin");
  for (let i = 0; i < pins.length; i++) {
    let p = pins[i];
    let idx = Number(p.dataset.i);

    p.onclick = function() { abrirMercado(idx); };
    p.onkeydown = function(e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        abrirMercado(idx);
      }
    };
    p.onmouseenter = p.onfocus = function() {
      mostrarTooltip(p.querySelector(".c"), listaMercados[idx]);
    };
    p.onmouseleave = p.onblur = function() {
      tooltip.style.display = "none";
    };
  }

  let htmlCards = "";
  for (let i = 0; i < listaMercados.length; i++) {
    let m = listaMercados[i];
    let ativo = passaFiltros(m);
    let classeOff = ativo ? "" : "off";
    let attrDisabled = ativo ? "" : "disabled";
    let mediaNotas = Math.round((m.a + m.p + m.v) / 3);

    htmlCards += `
      <button class="mini ${classeOff}" ${attrDisabled} data-i="${i}">
        <b>${i+1}. ${m.n}</b>
        <small>${m.d}</small>
        ${gerarEstrelas(mediaNotas)}
      </button>
    `;
  }

  $("#cards").innerHTML = htmlCards;

  let minis = $$(".mini");   for (let i = 0; i < minis.length; i++) {     minis[i].onclick = function() {       abrirMercado(Number(this.dataset.i));     };   } }  let botoesFiltro = $$("#filtros [data-f]");
for (let i = 0; i < botoesFiltro.length; i++) {
  botoesFiltro[i].onclick = function() {
    let f = this.dataset.f;
    if (filtrosAtivos.has(f)) {
      filtrosAtivos.delete(f);
      this.setAttribute("aria-pressed", "false");
    } else {
      filtrosAtivos.add(f);
      this.setAttribute("aria-pressed", "true");
    }
    renderizarHome();
  };
}

function abrirMercado(index) {
  mercadoSelecionado = listaMercados[index];
  tooltip.style.display = "none";

  $("#hero").style.backgroundImage = `url(${mercadoSelecionado.img})`;
  $("#aNome").textContent = mercadoSelecionado.n;
  $("#aEnd").textContent = mercadoSelecionado.end;

  $("#sA").innerHTML = gerarEstrelas(mercadoSelecionado.a);
  $("#sP").innerHTML = gerarEstrelas(mercadoSelecionado.p);
  $("#sV").innerHTML = gerarEstrelas(mercadoSelecionado.v);

  $("#aRota").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(mercadoSelecionado.end);

  navegarPara("attr");
}

let listaTodosProdutos = [];
for (let idCorredor = 0; idCorredor < bancoProdutos.length; idCorredor++) {
  let itensSeparados = bancoProdutos[idCorredor].split(",");
  for (let j = 0; j < itensSeparados.length; j++) {
    listaTodosProdutos.push({
      n: capitalizar(itensSeparados[j]),
      a: idCorredor
    });
  }
}

function encontrarCorredorProduto(nomeItem) {
  let busca = normalizarTexto(nomeItem.trim());

  for (let i = 0; i < listaTodosProdutos.length; i++) {
    if (normalizarTexto(listaTodosProdutos[i].n) === busca) {
      return listaTodosProdutos[i].a;
    }
  }

  if (busca.length > 2) {
    for (let i = 0; i < listaTodosProdutos.length; i++) {
      let nomeProd = normalizarTexto(listaTodosProdutos[i].n);
      if (nomeProd.includes(busca) || busca.includes(nomeProd)) {
        return listaTodosProdutos[i].a;
      }
    }
  }

  return 2;
}

let itensDaLista = [
  { t: "Tomate", a: 0, d: true },
  { t: "Leite", a: 1, d: true },
  { t: "Açúcar", a: 2, d: false },
  { t: "Óleo", a: 2, d: false }
];

let indiceItemAtual = 2;
let corredorDestaqueTemp = null;
let nomeDestaqueTemp = "";

function desenharMapaInterno() {
  $("#mNome").textContent = mercadoSelecionado.n;

  let corredorAlvo = corredorDestaqueTemp !== null ? corredorDestaqueTemp : (itensDaLista[indiceItemAtual] ? itensDaLista[indiceItemAtual].a : null);

  if (corredorAlvo === null) {
    $("#mInfo").textContent = "Lista concluída 🎉";
  } else if (corredorDestaqueTemp !== null && nomeDestaqueTemp) {
    $("#mInfo").textContent = `${nomeDestaqueTemp}: corredor ${secoesCorredores[corredorAlvo][0]} ${secoesCorredores[corredorAlvo][2]}`;
  } else {
    let itemObj = itensDaLista[indiceItemAtual];
    let nomeCorredor = secoesCorredores[corredorAlvo][0];
    $("#mInfo").textContent = `Próxima parada: ${itemObj.t} (Corredor ${nomeCorredor})`;
  }

  let svgConteudo = `
    <defs>
      <pattern id="piso" width="100" height="100" patternUnits="userSpaceOnUse">
        <rect width="100" height="100" fill="#fcfaf2"/>
        <circle cx="20" cy="20" r="3" fill="#ffefb3" opacity="0.5"/>
        <circle cx="70" cy="30" r="2.5" fill="#ffd1ff" opacity="0.4"/>
        <circle cx="40" cy="80" r="3.5" fill="#d1e3ff" opacity="0.5"/>
        <circle cx="90" cy="70" r="2" fill="#d1ffd6" opacity="0.4"/>
      </pattern>
    </defs>
    <rect width="360" height="520" fill="url(#piso)"/>
  `;

  for (let i = 0; i < secoesCorredores.length; i++) {
    let c = secoesCorredores[i];
    let x = 14 + (i % 4) * 85;
    let y = i < 4 ? 44 : 292;
    let h = i < 4 ? 196 : 176;
    let ehAlvo = (i === corredorAlvo);
    let opac = (corredorAlvo === null || ehAlvo) ? 1 : 0.6;
    let borda = ehAlvo ? 'stroke="var(--ac)" stroke-width="5"' : 'stroke="#222" stroke-width="1"';

    svgConteudo += `<rect x="${x}" y="${y}" width="72" height="${h}" rx="3" fill="${c[1]}" opacity="${opac}" ${borda}/>`;

    for (let k = 1; k < 5; k++) {
      svgConteudo += `<path d="M${x+4} ${y + k * h / 5}H${x+68}" stroke="#fff" stroke-width="2" opacity=".55"/>`;
    }

    svgConteudo += `
      <rect x="${x}" y="${y}" width="72" height="26" fill="#fff" stroke="#222" stroke-width="1"/>
      <text x="${x+36}" y="${y+17}" font-size="14" text-anchor="middle" fill="#111">${c[2]}</text>
      <text x="${x+36}" y="${y+38}" font-size="9" font-weight="700" text-anchor="middle" fill="#111">${c[0]}</text>
    `;
  }

  svgConteudo += `
    <rect x="0" y="480" width="360" height="40" fill="#cfc7b4"/>
    <text x="14" y="505" font-size="11" font-weight="700" fill="#111">🏁 ENTRADA</text>
  `;

  for (let k = 0; k < 3; k++) {
    svgConteudo += `
      <rect x="${150 + k * 65}" y="486" width="50" height="26" fill="#fff" stroke="#222"/>
      <text x="${175 + k * 65}" y="503" font-size="9" text-anchor="middle" fill="#111" font-weight="700">💰 CAIXA ${k+1}</text>
    `;
  }

  svgConteudo += `
    <g transform="translate(296,252)" fill="none" stroke-width="2.5">
      <path d="M0 0h6l4 14h16l4-10H8" stroke="#ff4d4d"/>
      <circle cx="13" cy="20" r="2.5" fill="#3fb950"/>
      <circle cx="24" cy="20" r="2.5" fill="#3fb950"/>
      <rect x="12" y="3" width="10" height="7" rx="1" fill="#58a6ff"/>
    </g>
  `;

  if (corredorAlvo !== null) {
    let coluna = corredorAlvo % 4;
    let posXGuia = coluna === 0 ? 7 : 14 + coluna * 85 - 6;
    let posYGuia = corredorAlvo < 4 ? 150 : 390;
    let posXInicial = 14 + coluna * 85;

    svgConteudo += `
      <path class="rota" d="M290 266H${posXGuia}V${posYGuia}H${posXInicial + 8}"/>
      <g transform="translate(${posXInicial + 36},${posYGuia + 10})">
        <g class="pulo">
          <path d="M0-26C-13-26-17-11 0 8 17-11 13-26 0-26Z" fill="var(--ac)" stroke="#111" stroke-width="2"/>
          <circle cy="-17" r="4.5" fill="#fff"/>
        </g>
      </g>
    `;
  }

  $("#planta").innerHTML = svgConteudo;
}

function renderizarListaCompras() {
  let htmlItens = "";

  for (let i = 0; i < itensDaLista.length; i++) {
    let item = itensDaLista[i];
    let classeOk = item.d ? "ok" : "";
    let classeSel = (i === indiceItemAtual) ? "sel" : "";
    let checkedStr = item.d ? "checked" : "";
    let nomeSetor = secoesCorredores[item.a][0];
    let emojiSetor = secoesCorredores[item.a][2];

    htmlItens += `
      <div class="item ${classeOk} ${classeSel}" data-i="${i}">
        <input type="checkbox" aria-label="Já peguei ${item.t}" ${checkedStr}>
        <span>${item.t}</span>
        <small>${emojiSetor} ${nomeSetor}</small>
        <button aria-label="Remover ${item.t}">✕</button>
      </div>
    `;
  }

  if (itensDaLista.length === 0) {
    htmlItens = "<p style='color:var(--mut)'>Lista vazia</p>";
  }

  $("#itens").innerHTML = htmlItens;

  let pegos = 0;
  for (let i = 0; i < itensDaLista.length; i++) {
    if (itensDaLista[i].d) pegos++;
  }

  $("#cont").textContent = `${pegos} de ${itensDaLista.length} itens`;

  let pct = itensDaLista.length > 0 ? (pegos / itensDaLista.length * 100) : 0;
  $("#prog").style.width = pct + "\%";    let elementosItem = $$("#itens .item");
  for (let i = 0; i < elementosItem.length; i++) {
    let el = elementosItem[i];
    let idx = Number(el.dataset.i);

    el.onclick = function(e) {
      if (e.target.tagName === "BUTTON") {
        itensDaLista.splice(idx, 1);
        if (indiceItemAtual >= itensDaLista.length) {
          indiceItemAtual = Math.max(0, itensDaLista.length - 1);
        }
      } else if (e.target.tagName === "INPUT") {
        itensDaLista[idx].d = !itensDaLista[idx].d;

        let proximoPendente = -1;
        for (let k = 0; k < itensDaLista.length; k++) {
          if (!itensDaLista[k].d) {
            proximoPendente = k;
            break;
          }
        }
        if (itensDaLista[idx].d && proximoPendente >= 0) {
          indiceItemAtual = proximoPendente;
        }
      } else {
        indiceItemAtual = idx;
      }

      corredorDestaqueTemp = null;
      renderizarListaCompras();
      desenharMapaInterno();
    };
  }
}

function adicionarItemLista(nome) {
  nome = nome.trim();
  if (nome === "") return;

  let idCorredor = encontrarCorredorProduto(nome);
  itensDaLista.push({
    t: capitalizar(nome),
    a: idCorredor,
    d: false
  });
}

$("#fechaLista").onclick = function() {
  $("#lista").classList.remove("on");
};

$("#limpaLista").onclick = function() {
    if (itensDaLista.length > 0 && confirm("Tem certeza que deseja limpar toda a lista?")) {
        itensDaLista = [];
        indiceItemAtual = 0;
        corredorDestaqueTemp = null;
        renderizarListaCompras();
        desenharMapaInterno();
    }
};

$("#addBtn").onclick = function() {
  let campoInput = $("#novo");
  adicionarItemLista(campoInput.value);
  campoInput.value = "";
  renderizarListaCompras();
};

$("#novo").onkeydown = function(e) {
  if (e.key === "Enter") {
    $("#addBtn").click();
  }
};

function mudarItemSelecionado(direcao) {
  if (itensDaLista.length > 0) {
    indiceItemAtual = (indiceItemAtual + direcao + itensDaLista.length) % itensDaLista.length;
    corredorDestaqueTemp = null;
    renderizarListaCompras();
    desenharMapaInterno();
  }
}

$("#ant").onclick = function() { mudarItemSelecionado(-1); };
$("#prox").onclick = function() { mudarItemSelecionado(1); };

function realizarBusca() {
  let buscaDigitada = normalizarTexto($("#q").value.trim());

  let categoriasFiltradas = [];
  if (buscaDigitada !== "") {
    for (let i = 0; i < secoesCorredores.length; i++) {
      let c = secoesCorredores[i];
      if (normalizarTexto(c[0]).includes(buscaDigitada)) {
        categoriasFiltradas.push({ n: c[0], a: i, t: "Corredor", e: c[2] });
      }
    }
  }

  let produtosFiltrados = [];
  if (buscaDigitada !== "") {
    let contador = 0;
    for (let i = 0; i < listaTodosProdutos.length; i++) {
      let p = listaTodosProdutos[i];
      if (normalizarTexto(p.n).includes(buscaDigitada)) {
        produtosFiltrados.push({ n: p.n, a: p.a, t: secoesCorredores[p.a][0], e: secoesCorredores[p.a][2] });
        contador++;
        if (contador >= 8) break;
      }
    }
  }

  let todosResultados = categoriasFiltradas.concat(produtosFiltrados);

  if (buscaDigitada !== "") {
    if (todosResultados.length > 0) {
      let htmlRes = "";
      for (let i = 0; i < todosResultados.length; i++) {
        let item = todosResultados[i];
        htmlRes += `<li><button data-a="${item.a}" data-n="${item.n}"><b>${item.n}</b><span>${item.e} ${item.t}</span></button></li>`;
      }
      $("#res").innerHTML = htmlRes;
    } else {
      $("#res").innerHTML = `<li class="vazio">Nenhum produto encontrado.</li>`;
    }
  } else {
    $("#res").innerHTML = "";
  }

  if (buscaDigitada === "") {
    let htmlCats = "";
    for (let i = 0; i < secoesCorredores.length; i++) {
      let c = secoesCorredores[i];
      htmlCats += `<button class="cat" style="background:${c[1]}" data-a="${i}" data-n="">${c[2]} ${c[0]}</button>`;
    }
    $("#cats").innerHTML = htmlCats;
  } else {
    $("#cats").innerHTML = "";   }    let botoesResultado = $$("#res button, .cat");
  for (let i = 0; i < botoesResultado.length; i++) {
    botoesResultado[i].onclick = function() {
      corredorDestaqueTemp = Number(this.dataset.a);
      nomeDestaqueTemp = this.dataset.n;
      navegarPara("mapa");
    };
  }
}

$("#q").oninput = realizarBusca;

const divChat = $("#chat");
let contadorMsg = 0;

function adicionarMensagem(html, ehUsuario) {
  let div = document.createElement("div");
  div.className = "msg" + (ehUsuario ? " eu" : "");
  div.innerHTML = html;
  divChat.appendChild(div);
  divChat.scrollTop = divChat.scrollHeight;
  return div;
}

function simularDigitando(callback, tempo) {
  let carregando = adicionarMensagem('<span class="dots" role="img" aria-label="Assistente digitando"><i></i><i></i><i></i></span>', false);
  let tempoEspera = tempo || (1000 + Math.random() * 800);

  setTimeout(function() {
    carregando.remove();
    callback();
  }, tempoEspera);
}

function enviarMensagemChat(texto) {
  texto = texto.trim();
  if (texto === "") return;

  adicionarMensagem(escaparHTML(texto), true);
  $("#msgIn").value = "";

  simularDigitando(function() {
    processarRespostaIA(texto);
  });
}

function processarRespostaIA(texto) {
  let busca = normalizarTexto(texto);
  let receitaEncontrada = null;

  for (let i = 0; i < receitasIA.length; i++) {
    let r = receitasIA[i];
    let palavrasChave = r[1].split("|");
    let achou = false;
    for (let k = 0; k < palavrasChave.length; k++) {
      if (busca.includes(palavrasChave[k])) {
        achou = true;
        break;
      }
    }
    if (achou) {
      receitaEncontrada = r;
      break;
    }
  }

  if (receitaEncontrada) {
    contadorMsg++;
    let idBox = "r" + contadorMsg;
    let ingredientes = receitaEncontrada[2].split(",");

    let htmlIng = "";
    for (let i = 0; i < ingredientes.length; i++) {
      let ing = ingredientes[i];
      let jaEstaNaLista = false;

      for (let k = 0; k < itensDaLista.length; k++) {
        if (normalizarTexto(itensDaLista[k].t) === normalizarTexto(ing)) {
          jaEstaNaLista = true;
          break;
        }
      }

      let desabilitado = jaEstaNaLista ? "disabled" : "checked";
      let idCorredor = encontrarCorredorProduto(ing);
      let statusTexto = jaEstaNaLista ? "já na lista" : secoesCorredores[idCorredor][2] + " " + secoesCorredores[idCorredor][0];

      htmlIng += `
        <label>
          <input type="checkbox" value="${ing}" ${desabilitado}>
          ${capitalizar(ing)}
          <small>${statusTexto}</small>
        </label>
      `;
    }

    let resposta = `Boa escolha! Para <b>${receitaEncontrada[0]}</b> você vai precisar de:
      <div class="ing" id="${idBox}">${htmlIng}</div>
      Desmarque o que você já tem em casa. Quer adicionar à sua lista?
      <button class="btn p" data-add="${idBox}">📝 Adicionar à lista</button>`;

    adicionarMensagem(resposta, false);
  } else if (/^(oi|ola|bom dia|boa tarde|boa noite|e ai)/.test(busca)) {
    adicionarMensagem("Olá! 👋 O que você quer cozinhar hoje?", false);
  } else if (busca.includes("obrigad")) {
    adicionarMensagem("De nada! Boas compras.🛒", false);
  } else {
    let exemplos = [];
    for (let i = 0; i < 6; i++) {
      exemplos.push(receitasIA[i][0].toLowerCase());
    }
    adicionarMensagem("Ainda não conheço essa receita. 😕 Experimente: " + exemplos.join(", ") + "...", false);
  }
}

divChat.addEventListener("click", function(e) {
  let btn = e.target.closest("[data-add]");
  if (!btn) return;

  let idBox = btn.dataset.add;
  let box = $("#" + idBox);
  let marcados = Array.from(box.querySelectorAll("input:checked:not(:disabled)"));

  let selecionados = [];
  for (let i = 0; i < marcados.length; i++) {
    selecionados.push(marcados[i].value);
  }

  btn.disabled = true;
  let todosInputs = box.querySelectorAll("input");
  for (let i = 0; i < todosInputs.length; i++) {
    todosInputs[i].disabled = true;
  }

  if (selecionados.length === 0) {
    simularDigitando(function() {
      adicionarMensagem("Tudo bem, não adicionei nada.", false);
    }, 500);
    return;
  }

  for (let i = 0; i < selecionados.length; i++) {
    adicionarItemLista(selecionados[i]);
  }

  corredorDestaqueTemp = null;

  for (let i = 0; i < itensDaLista.length; i++) {
    if (!itensDaLista[i].d) {
      indiceItemAtual = i;
      break;
    }
  }

  renderizarListaCompras();

  simularDigitando(function() {
    let plural = selecionados.length > 1 ? "itens" : "item";
    adicionarMensagem(`Pronto! Adicionei ${selecionados.length} ${plural} à sua lista e já montei a rota.<button class="btn" data-go="mapa">🛒 Ver no mapa</button>`, false);
  }, 600);
});

$("#chatForm").onsubmit = function(e) {
  e.preventDefault();
  enviarMensagemChat($("#msgIn").value); };  let botoesSugestao = $$("#sugIA .btn");
for (let i = 0; i < botoesSugestao.length; i++) {
  botoesSugestao[i].onclick = function() {
    enviarMensagemChat(this.textContent);
  };
}

adicionarMensagem("Olá! 👋 Diga o que quer cozinhar (por exemplo, \"quero fazer uma lasanha\") e eu sugiro os ingredientes.", false);

aplicarConfiguracoes();
renderizarHome();
</script>
